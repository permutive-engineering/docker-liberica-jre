name: Build
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # every day 1pm (UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:
    description: "Allows manual trigger via GitHub"

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Clean up Disk
        run: bash .github/cleanup.sh

      - name: Docker Build Cache
        uses: actions/cache@v3
        with:
          path: /tmp/docker-builds
          key: ${{ runner.os }}-${{ hashFiles('**/docker/build.sh') }}-${{ hashFiles('**/docker/liberica-base/Dockerfile') }}-${{ hashFiles('**/docker/liberica-jre/Dockerfile') }}-${{ hashFiles('**/.github/workflows/build.yaml') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('**/docker/build.sh') }}-${{ hashFiles('**/docker/liberica-base/Dockerfile') }}-${{ hashFiles('**/docker/liberica-jre/Dockerfile') }}-${{ hashFiles('**/.github/workflows/build.yaml') }}-

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build docker images
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Building and pushing Docker images"
            docker/build.sh push
          else
            echo "Building Docker images"
            docker/build.sh
          fi
